name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk ChargeInfo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeInfo
          path: ChargeInfo.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ChargeInfo.apk --title "Charge Info (latest build)" --notes "Download ChargeInfo.apk on your phone and install it."
